[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymapf"
description = "A 2D multi-agent pathfinding research and simulation platform with prioritized planning, CBS, and MAPPO"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Erwin Lejeune", email = "erwinlejeune.pro@gmail.com" }]
keywords = [
    "multi-agent",
    "path-finding",
    "mapf",
    "prioritized-planning",
    "cbs",
    "mappo",
    "reinforcement-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Framework :: Pytest",
]

# The planning framework is pure standard library. Only the RL layer needs
# NumPy, which is exposed as an optional extra below.
dependencies = []

# Single source of truth for the version. setuptools reads the literal
# statically, so this does not import the package at build time.
dynamic = ["version"]

[project.optional-dependencies]
rl = ["numpy>=1.20"]
rl-torch = ["numpy>=1.20", "torch>=1.13"]
rl-ecosystem = ["numpy>=1.20", "gymnasium>=0.29", "pettingzoo>=1.24"]
dev = ["pytest>=6.0"]

[project.urls]
Homepage = "https://github.com/Shoaib9124/Multi-Agent-PathFinding"
Source = "https://github.com/Shoaib9124/Multi-Agent-PathFinding"
Changelog = "https://github.com/Shoaib9124/Multi-Agent-PathFinding/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "pymapf.__version__" }

[tool.setuptools.packages.find]
include = ["pymapf*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
